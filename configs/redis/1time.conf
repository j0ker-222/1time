# Redis overrides for the 1time service.
# Add at the END of /etc/redis/redis.conf:
#     include /etc/redis/1time.conf
# Later directives win, so these replace the distribution defaults.
#
# Note: these settings apply to the whole Redis instance. If other
# services on the host use the same Redis, check them first
# (redis-cli CLIENT LIST) or run a separate instance for 1time.

bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Password: generate with `openssl rand -hex 32` and put the same value
# into REDISPASS in /etc/custom_1time/env.
requirepass CHANGE_ME_TO_A_LONG_RANDOM_VALUE

# Keep secrets in memory only: no RDB snapshots, no AOF on disk.
# Trade-off: unread messages are lost when Redis restarts.
save ""
appendonly no

# Bounded memory. noeviction makes new writes fail instead of silently
# dropping messages that were not read yet.
maxmemory 256mb
maxmemory-policy noeviction

# Commands the service never needs.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""
