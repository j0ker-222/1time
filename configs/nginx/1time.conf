# nginx site for the 1time service.
# Replace HOSTNAME with the real host (for example onetime.j0ker.site).
# limit_req_zone lives in the http context; sites-enabled files are included there.

limit_req_zone $binary_remote_addr zone=onetime_api:10m rate=10r/s;

upstream onetime_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on nginx 1.22 (Debian 12) and newer;
    # on nginx >= 1.25.1 it may be replaced by "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:onetime_ssl:10m;
    ssl_session_tickets off;

    root /var/www/onetime;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Security headers ("always" so they are sent on errors too).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    access_log /var/log/nginx/onetime_access.log;
    error_log  /var/log/nginx/onetime_error.log;

    rewrite ^/ico.png$ /favicon-1024.png last;

    # The server would see the plaintext here; scripts use "1time send"
    # (client-side encryption) instead. Also disabled in the backend
    # unless ENABLE_UNSEC_SAVE=1.
    location = /api/unsecSave {
        return 404;
    }

    location /api/ {
        limit_req zone=onetime_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://onetime_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Kill-switch for the service worker of the old build: must not be cached.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routes (/, /new, /v/...): always serve the current index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
