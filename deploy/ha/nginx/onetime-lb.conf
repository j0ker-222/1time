# nginx site for the 1time service on the load balancers lb1 and lb2.
# Same file on both nodes. HOSTNAME resolves to the VIP (203.0.113.10),
# keepalived moves the VIP between lb1 and lb2.
# Static files (frontend/build) are copied to /var/www/onetime on both LBs.
# limit_req_zone lives in the http context; sites-enabled files are included there.

limit_req_zone $binary_remote_addr zone=onetime_api:10m rate=10r/s;

# Two application nodes, round robin (equal weights). A node that refuses
# connections or times out is skipped for fail_timeout and the request goes
# to the other one. Both nodes use the same PostgreSQL, so any node can
# open any link.
upstream onetime_backend {
    server 10.10.0.21:8080 max_fails=2 fail_timeout=10s;
    server 10.10.0.22:8080 max_fails=2 fail_timeout=10s;
    # Planned maintenance of a node: add "down" to its line and run
    # "nginx -s reload" on both LBs (or just stop custom_1time on it, see README).
    keepalive 32;
}

# Local health endpoint for keepalived (check_nginx.sh). Not reachable from outside.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /lb-health {
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" works on nginx 1.22 (Debian 12) and newer;
    # on nginx >= 1.25.1 it may be replaced by "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:onetime_ssl:10m;
    ssl_session_tickets off;

    root /var/www/onetime;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Security headers ("always" so they are sent on errors too).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    access_log /var/log/nginx/onetime_access.log;
    error_log  /var/log/nginx/onetime_error.log;

    rewrite ^/ico.png$ /favicon-1024.png last;

    location /api/ {
        limit_req zone=onetime_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://onetime_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        # On a refused or timed out connection try the other node. nginx
        # never repeats a POST that has already reached a backend (that
        # needs "non_idempotent"), so a message cannot be taken twice.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # Which node is answering: curl -s https://HOSTNAME/api/health -D - | grep X-Upstream
    location = /api/health {
        proxy_pass http://onetime_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Upstream $upstream_addr always;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Kill-switch for the service worker of the old build: must not be cached.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routes (/, /new, /v/...): always serve the current index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
