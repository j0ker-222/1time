# /etc/systemd/system/custom_1time.service.d/ha.conf on app1 and app2.
# The base unit only allows localhost (nginx and Redis on the same host).
# In the HA setup nginx is on lb1/lb2 and PostgreSQL on app1/app2.
[Unit]
After=network-online.target postgresql.service
Wants=network-online.target

[Service]
IPAddressDeny=any
IPAddressAllow=localhost 10.10.0.0/24
