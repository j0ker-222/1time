# /etc/postgresql/<ver>/main/conf.d/onetime.conf on app1 and app2.
# app1 starts as primary, app2 as hot standby (streaming replication).
listen_addresses = 'localhost,10.10.0.21'     # app2: 'localhost,10.10.0.22'

wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
hot_standby = on
wal_log_hints = on            # needed by pg_rewind to bring a former primary back

# Synchronous replication: a link is confirmed to the user only after the
# standby has it, so promoting the standby never loses links.
# Name = application_name of the standby (cluster_name below).
synchronous_commit = on
synchronous_standby_names = 'ANY 1 (app1, app2)'
cluster_name = 'app1'                          # app2: 'app2'

password_encryption = scram-sha-256
