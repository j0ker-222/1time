# /etc/keepalived/keepalived.conf on lb2 (BACKUP by priority).
# Addresses follow the plan in deploy/ha/README.md, replace them with yours.

global_defs {
    router_id onetime_lb2
    script_user root
    enable_script_security
}

# nginx must be alive and answer on the local port. No "weight": a failed
# check puts the node into FAULT and it gives the VIP away at once. With a
# weight the priority would only drop, and because of nopreempt the peer
# would never take the VIP from a master whose nginx is dead.
vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
}

vrrp_instance VI_ONETIME {
    state BACKUP              # both nodes start as BACKUP, priority picks the master
    interface eth0            # interface that carries the VIP
    virtual_router_id 51      # same on both nodes, unique in the L2 segment
    priority 100              # lb1 has 150
    advert_int 1
    nopreempt                 # after lb1 comes back the VIP stays where it is (no extra flap)

    # Unicast VRRP: works where multicast is filtered (most hosters).
    unicast_src_ip 10.10.0.12
    unicast_peer {
        10.10.0.11
    }

    authentication {
        auth_type PASS
        auth_pass CHANGEME    # 8 characters max, same on both nodes
    }

    virtual_ipaddress {
        203.0.113.10/32 dev eth0 label eth0:vip
    }

    track_script {
        chk_nginx
    }
}
